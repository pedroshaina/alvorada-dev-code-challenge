services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
      POSTGRES_DB: reservations
    ports:
      - "55432:5432"
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://reservations:reservations@db:5432/reservations
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
